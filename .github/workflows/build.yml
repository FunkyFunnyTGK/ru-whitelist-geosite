name: build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download whitelist
        run: curl -fsSL -o sni.txt https://github.com/ancored/ru-mobile-whitelist/releases/latest/download/ru-mobile-whitelist-sni.txt

      - name: Build dat
        run: |
          tr -d '\r' < sni.txt > sni.clean.txt
          test "$(grep -c . sni.clean.txt)" -gt 500
          python3 mkdat.py ru-whitelist.dat ru-whitelist=sni.clean.txt
          python3 readdat.py ru-whitelist.dat

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "ru-whitelist.dat" --notes "Auto-built daily from ancored/ru-mobile-whitelist."
          gh release upload latest ru-whitelist.dat sni.clean.txt#ru-whitelist.txt --clobber
